name: DB migrations

# Applies the SQL in legacy-vercel/db/ against Supabase so nobody has to paste
# SQL by hand. Two ways to trigger:
#   • Manually: Actions tab → "DB migrations" → Run workflow  (or Claude runs it)
#   • Automatically: when a change to legacy-vercel/db/*.sql lands on main
#
# EACH FILE RUNS ONCE. This used to re-run every file on every push, which is
# fine for a schema change written as CREATE OR REPLACE and catastrophic for a
# one-shot data repair. On 2026-09-05, thirteen minutes after Sara honoured an
# unsubscribe, a deploy re-ran db/063_clear_false_import_dnc.sql — a one-time
# clean-up of opt-out flags a bad 2026-08-09 CSV import had set — and it cleared
# EVERY opt-out in the table, including the one from that morning. It had been
# doing that on every deploy since August; the table held zero opt-outs of any
# kind when it was found. See db/104.
#
# So: public.schema_migrations records what has been applied, and this job skips
# anything already listed. On the FIRST run against an empty ledger it records
# every file currently on disk without running them — correct, because the old
# workflow had already applied them all, repeatedly.
#
# Requires ONE repository secret: SUPABASE_DB_URL (Supabase → Project Settings →
# Database → Connection string → URI). Until it exists this job prints a note and
# exits cleanly — it never fails the repo.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'legacy-vercel/db/*.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice::SUPABASE_DB_URL secret is not set — add it in Settings → Secrets and variables → Actions, then re-run. Skipping for now."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          run_sql () { psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "$1"; }

          # The ledger must exist before anything consults it. Created here as
          # well as in db/104 so a fresh database is never a chicken-and-egg.
          run_sql "CREATE TABLE IF NOT EXISTS public.schema_migrations (
                     filename text PRIMARY KEY,
                     applied_at timestamptz NOT NULL DEFAULT now(),
                     note text);" >/dev/null

          FILES=$(ls legacy-vercel/db/[0-9]*.sql | sort)

          applied_count=$(run_sql "SELECT count(*) FROM public.schema_migrations")
          if [ "$applied_count" = "0" ]; then
            echo "Ledger is empty — first run. Recording everything already on disk as applied,"
            echo "because the previous workflow re-ran all of it on every push. Nothing is executed."
            for f in $FILES; do
              b=$(basename "$f")
              run_sql "INSERT INTO public.schema_migrations (filename, note)
                       VALUES ('$b', 'seeded on first ledger run — applied before the ledger existed')
                       ON CONFLICT (filename) DO NOTHING;" >/dev/null
              echo "    seeded $b"
            done
            echo "Done. Future migrations will run exactly once."
            exit 0
          fi

          failed=""
          applied=""
          for f in $FILES; do
            b=$(basename "$f")
            if [ -n "$(run_sql "SELECT 1 FROM public.schema_migrations WHERE filename = '$b'")" ]; then
              echo "--- skip $b (already applied)"
              continue
            fi
            echo "=== applying $b ==="
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"; then
              run_sql "INSERT INTO public.schema_migrations (filename) VALUES ('$b')
                       ON CONFLICT (filename) DO NOTHING;" >/dev/null
              echo "    ok"
              applied="$applied $b"
            else
              # NOT recorded, so the next run retries it rather than skipping a
              # migration that never actually landed.
              echo "::warning::migration failed: $b"
              failed="$failed $b"
            fi
          done

          [ -n "$applied" ] && echo "Applied:$applied"
          if [ -n "$failed" ]; then
            echo "::error::These migrations failed and were NOT recorded — they will be retried next run:$failed"
            exit 1
          fi
          echo "Done."
